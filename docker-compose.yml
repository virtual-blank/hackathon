services:

  postgres:
    image: postgres:16.2-alpine
    container_name: core_db
    restart: unless-stopped
    env_file:
      - .env 
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_NAME}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_network

  minio:
    build:
      context: ./backend/src/users/pfp
      dockerfile: Dockerfile
    image: minio-local:2025-10-15
    container_name: minio_server
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "9000:9000" # API
      - "9001:9001" # WEB UI
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app_network

  minio-init:
    image: minio-local:2025-10-15
    pull_policy: never
    container_name: minio_init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      BUCKET: ${MINIO_BUCKET_NAME}
      ACHIEVEMENTS_BUCKET: achievements
    volumes:
      - ./frontend/src/assets/defaults:/defaults:ro
      - ./frontend/src/assets/achievements:/achievements:ro
    networks:
      - app_network
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\"; do sleep 1; done &&
      mc mb --ignore-existing local/$$BUCKET &&
      mc anonymous set download local/$$BUCKET/defaults &&
      mc anonymous set download local/$$BUCKET/pfp &&
      mc cp /defaults/default-pfp.webp local/$$BUCKET/defaults/default-pfp.webp &&
      mc mb --ignore-existing local/$$ACHIEVEMENTS_BUCKET &&
      mc anonymous set download local/$$ACHIEVEMENTS_BUCKET &&
      mc mirror --overwrite /achievements local/$$ACHIEVEMENTS_BUCKET
      "

  backend:
    build:
      context: ./backend      
      dockerfile: Dockerfile
    container_name: fastapi_backend
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - MINIO_ENDPOINT=http://minio:9000
      # MINIO_PUBLIC_URL берётся из .env (локально http://localhost:9000, на сервере https://домен)
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - app_network
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: frontend_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:2024.10.0
    container_name: cloudflare_tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    env_file:
      - .env
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - app_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  seed:
    profiles: ["seed"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: seed_runner
    restart: "no"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - MINIO_ENDPOINT=http://minio:9000
      # MINIO_PUBLIC_URL берётся из .env (http://localhost:9000): он попадает в ссылки на аватарки
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    networks:
      - app_network
    volumes:
      - ./frontend/src/assets:/frontend/src/assets:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo '[seed] Checking if demo data already exists...'
        cat << 'EOF' > /tmp/check.py
        import asyncio, asyncpg, os
        from core.config import get_db_settings
        async def main():
            try:
                conn = await asyncpg.connect(get_db_settings().url.replace('+asyncpg', ''))
                u1 = os.getenv('SYNTHETIC_USER_1_EMAIL', '')
                u2 = os.getenv('SYNTHETIC_USER_2_EMAIL', '')
                val = await conn.fetchval('SELECT count(*) FROM users WHERE email = $1 OR email = $2', u1, u2)
                print(val)
                await conn.close()
            except Exception:
                print(0)
        asyncio.run(main())
        EOF
        COUNT=$$(python /tmp/check.py)
        if [ "$$COUNT" -gt 0 ] && [ "$$FORCE_SEED" != "1" ]; then
          echo "[seed] Demo data already loaded (found $$COUNT users). Skipping."
          echo "[seed] Set FORCE_SEED=1 to force reload."
          exit 0
        fi
        echo '[seed] Running fill_db...'
        python -m src.synthetic.fill_db
        echo '[seed] Done.'

volumes:
  pg_data:
  minio_data:

networks:
  app_network:
    driver: bridge 